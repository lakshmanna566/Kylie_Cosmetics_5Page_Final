
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Contact - Kylie Cosmetics</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="site-header">
  <div class="container navwrap">
    <div class="logo">KYLIE COSMETICS</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </div>
</header>

<main class="container contact-section">
  <h2>Contact Us</h2>
  <form id="contact-form" class="contact-form">
    <label>Name</label>
    <input type="text" name="name" placeholder="Your name" required>
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required>
    <label>Message</label>
    <textarea name="message" rows="6" placeholder="How can we help?" required></textarea>
    <button type="submit" class="btn">Send Message</button>
  </form>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2025 Kylie Cosmetics Fan Site — Designed for demo purposes.</p>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>
